[package]
name = "server-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
axum = { version = "0.8", features = ["tokio", "http1", "http2"] }
tower = { version = "0.5" }
tower-http = { version = "0.6", features = ["fs", "cors", "compression-full", "set-header"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jsonwebtoken = "9.3"
bcrypt = "0.17"
mimalloc = { version = "0.1", default-features = false }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
http = "1.2"
moka = { version = "0.12", features = ["future"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
