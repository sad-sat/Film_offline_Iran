    <script>
        let currentPage = 1;
        const pageSize = 30;
        let isLoading = false;
        let searchTimeout = null;

        function getActiveProfile() {
            return localStorage.getItem('activeProfile') || 'کاربر اصلی';
        }

        function getProfileFavs() {
            const p = getActiveProfile();
            const key = 'userFavorites_' + encodeURIComponent(p);
            let favs = JSON.parse(localStorage.getItem(key) || 'null');
            if (!favs && p === 'کاربر اصلی') {
                favs = JSON.parse(localStorage.getItem('userFavorites') || '[]');
                localStorage.setItem(key, JSON.stringify(favs));
            }
            return favs || [];
        }

        function setProfileFavs(favs) {
            const p = getActiveProfile();
            const key = 'userFavorites_' + encodeURIComponent(p);
            localStorage.setItem(key, JSON.stringify(favs));
            if (p === 'کاربر اصلی') localStorage.setItem('userFavorites', JSON.stringify(favs));
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            if (!t) return;
            t.textContent = msg;
            t.style.display = 'block';
            setTimeout(() => { t.style.display = 'none'; }, 2400);
        }

        window.onCardPosterError = function(img) {
            const id = img.dataset.id;
            if (!img.dataset.triedMetahub && id && id.startsWith('tt')) {
                img.dataset.triedMetahub = '1';
                img.src = `https://images.metahub.space/poster/medium/${id}/img`;
            } else {
                img.parentElement.classList.add('no-poster');
            }
        };

        function renderCard(movie) {
            const englishTitle = movie.title || movie.titleFa;
            const poster = movie.poster || `/images/posters/${movie.id}.webp`;
            const year = movie.year || '';

            return `
                <a href="/htmls/moviereview.html?id=${movie.id}" class="netflix-card" data-id="${movie.id}">
                    <div class="card-img-wrap">
                        <div class="card-s-badge" aria-hidden="true">
                            <img src="/images/sadflix_s_badge.png" width="14" height="22" alt="S" style="display: block;">
                        </div>
                        <img data-id="${movie.id}" src="${poster}" alt="${englishTitle}" loading="lazy" onload="if(this.naturalWidth <= 1) window.onCardPosterError(this)" onerror="window.onCardPosterError(this)">
                        <div class="card-fallback">
                            <span class="fallback-icon">🎬</span>
                            <span class="fallback-title">${englishTitle}</span>
                        </div>
                    </div>
                    <div class="card-info">
                        <div class="card-title-en" dir="ltr" title="${englishTitle}">${englishTitle}</div>
                        <div class="card-meta" dir="ltr">
                            <span>${year}</span>
                            ${year ? '<span>•</span>' : ''}
                            <span>Movie</span>
                        </div>
                    </div>
                </a>
            `;
        }

        window.toggleCardFav = function(e, id) {
            if (e) { e.preventDefault(); e.stopPropagation(); }
            let favs = getProfileFavs();
            if (favs.includes(id)) {
                favs = favs.filter(x => x !== id);
                showToast('از لیست من حذف شد');
            } else {
                favs.push(id);
                showToast('به لیست من اضافه شد! ✓');
            }
            setProfileFavs(favs);
            document.querySelectorAll(`.netflix-card[data-id="${id}"] .card-fav-btn`).forEach(btn => {
                const nowFav = favs.includes(id);
                btn.className = `card-fav-btn ${nowFav ? 'active' : ''}`;
                btn.textContent = nowFav ? '❤️' : '🤍';
            });
        };

        async function fetchMovies(page = 1, append = false) {
            if (isLoading) return;
            isLoading = true;
            const btn = document.getElementById('loadMoreBtn');
            btn.disabled = true;
            btn.textContent = 'در حال دریافت…';

            const genre = document.getElementById('genreFilter').value;
            const sort = document.getElementById('sortFilter').value;
            const q = document.getElementById('searchInput').value.trim();

            if (sort === 'favs') {
                const favs = getProfileFavs();
                const grid = document.getElementById('moviesGrid');
                if (favs.length === 0) {
                    grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #aaa; padding: 60px 20px;">هیچ فیلمی در لیست من ثبت نشده است. با کلیک روی نماد قلب در هر فیلم می‌توانید آن را ذخیره کنید.</div>';
                    btn.style.display = 'none';
                    isLoading = false;
                    return;
                }
                try {
                    const res = await fetch('/api/movies/batch', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ ids: favs })
                    });
                    if (res.ok) {
                        const movies = await res.json();
                        const movieOnly = (Array.isArray(movies) ? movies : []).filter(m => m.type !== 'tvSeries');
                        grid.innerHTML = movieOnly.map(renderCard).join('');
                        btn.style.display = 'none';
                    }
                } catch(e) { console.error(e); }
                isLoading = false;
                return;
            }

            let url = `/api/movies?type=movie&page=${page}&limit=${pageSize}&sort=${sort}`;
            if (genre) url += `&genre=${encodeURIComponent(genre)}`;
            if (q) url += `&q=${encodeURIComponent(q)}`;

            try {
                const res = await fetch(url);
                if (res.ok) {
                    const data = await res.json();
                    const list = Array.isArray(data) ? data : (data.items || data.movies || []);
                    const grid = document.getElementById('moviesGrid');
                    if (!append) {
                        grid.innerHTML = list.map(renderCard).join('');
                    } else {
                        grid.insertAdjacentHTML('beforeend', list.map(renderCard).join(''));
                    }

                    if (!list || list.length < pageSize) {
                        btn.style.display = 'none';
                    } else {
                        btn.style.display = 'inline-block';
                    }
                }
            } catch (e) {
                console.error(e);
            } finally {
                isLoading = false;
                btn.disabled = false;
                btn.textContent = 'بارگذاری فیلم‌های بیشتر';
            }
        }

        function applyFilters() {
            currentPage = 1;
            fetchMovies(currentPage, false);
        }

        function debounceSearch() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                applyFilters();
            }, 300);
        }

        function loadMore() {
            currentPage++;
            fetchMovies(currentPage, true);
        }

        window.addEventListener('scroll', () => {
            const nav = document.getElementById('netflixNav');
            if (window.scrollY > 40) nav.classList.add('solid');
            else nav.classList.remove('solid');
        });

        function updateNavProfile() {
            const user = localStorage.getItem('movieUser');
            let profile = localStorage.getItem('activeProfile') || (user || 'کاربر اصلی');
            const profileNameEl = document.getElementById('activeProfileName');
            if (profileNameEl) profileNameEl.textContent = profile;

            const pic = localStorage.getItem('activeProfilePic') || '1';
            const avatarEl = document.getElementById('activeProfileAvatar');
            if (avatarEl) {
                avatarEl.src = (pic === '3') ? '/movie-streaming-webapp-master/img/profile-pic/3.jpg' : `/movie-streaming-webapp-master/img/profile-pic/${pic}.png`;
            }
        }
        updateNavProfile();

        const activeNav = document.querySelector('.nav-links .nav-link.active');
        if (activeNav) {
            try { activeNav.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' }); } catch(_) {}
        }

        fetchMovies(1, false);
    </script>
